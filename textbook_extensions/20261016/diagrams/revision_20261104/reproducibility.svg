   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle" x="324" y="25.993066" transform="rotate(-0 324 25.993066)">Reproduction requires comparable conditions</text>
